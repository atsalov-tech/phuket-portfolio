<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, viewport-fit=cover" />
  <title>Phuket Private Collection — Villas & Yachts</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Phuket Villas" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="./style.css?v=2" />
  <style>
    .pdf-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0e1013;
      display: none;
      flex-direction: column;
    }
    .pdf-overlay.open {
      display: flex;
    }
    .pdf-topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;
      background: rgba(14, 16, 19, 0.96);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .pdf-nav-btn {
      appearance: none;
      border: 1px solid rgba(212, 175, 55, 0.45);
      background: rgba(212, 175, 55, 0.14);
      color: #f3d58d;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 13px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .pdf-nav-btn.secondary {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .pdf-topbar-info {
      flex: 1;
      min-width: 0;
      text-align: center;
    }
    .pdf-topbar-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pdf-topbar-status {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }
    .pdf-topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pdf-pages-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 10px calc(28px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .pdf-pages-inner {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: width 0.18s ease;
    }
    .pdf-page-card {
      width: 100%;
      background: #171a20;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    }
    .pdf-page-img {
      display: block;
      width: 100%;
      height: auto;
    }
    .pdf-loading-msg {
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      text-align: center;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-top-row">
        <div class="brand-row">
          <span class="brand-subtitle" id="brand-subtitle">PHUKET PRIVATE PORTFOLIO</span>
          <h1 class="brand-title" id="brand-title">Villas & Yachts</h1>
        </div>

        <div class="header-controls">
          <button class="ig-pill-btn" id="btn-instagram" type="button" aria-label="Instagram" title="Instagram">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            <span class="ig-pill-label">Instagram</span>
          </button>

          <div class="lang-switcher" role="group" aria-label="Language">
            <button class="lang-btn active" data-lang="en" type="button" aria-label="English">🇬🇧</button>
            <button class="lang-btn" data-lang="ru" type="button" aria-label="Русский">🇷🇺</button>
          </div>
        </div>
      </div>

      <div class="deal-switcher" role="tablist" aria-label="Deal type">
        <button class="deal-tab active" data-deal="rent" type="button">
          <span id="label-rent">Rent</span> <span class="tab-count" id="count-rent">0</span>
        </button>
        <button class="deal-tab" data-deal="sale" type="button">
          <span id="label-sale">Sale</span> <span class="tab-count" id="count-sale">0</span>
        </button>
      </div>

      <nav class="location-filters" id="location-filters" aria-label="Locations"></nav>
    </header>

    <main class="catalog-feed" id="catalog-feed"></main>

    <section class="ig-footer-wrap">
      <button class="ig-footer-card" id="ig-footer-card" type="button">
        <div class="ig-footer-left">
          <div class="ig-footer-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </div>
          <div class="ig-footer-text">
            <div class="ig-footer-title" id="ig-footer-title">Follow on Instagram • @familiaholiday</div>
            <div class="ig-footer-sub" id="ig-footer-sub">Videos, stories & daily Phuket updates</div>
          </div>
        </div>
        <span class="ig-footer-cta" id="ig-footer-cta">Open ↗</span>
      </button>
    </section>
  </div>

  <div class="detail-overlay" id="detail-overlay" aria-hidden="true">
    <div class="detail-sheet" id="detail-sheet">
      <button class="close-btn" id="detail-close" type="button" aria-label="Close">✕</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <div class="pdf-overlay" id="pdf-overlay" aria-hidden="true">
    <div class="pdf-topbar">
      <button class="pdf-nav-btn" id="pdf-back-btn" type="button">← Back</button>
      <div class="pdf-topbar-info">
        <div class="pdf-topbar-title" id="pdf-doc-title">Brochure</div>
        <div class="pdf-topbar-status" id="pdf-page-status">Loading PDF...</div>
      </div>
      <div class="pdf-topbar-actions">
        <button class="pdf-nav-btn secondary" id="pdf-share-btn" type="button" aria-label="Share link" title="Share link">🔗</button>
        <button class="pdf-nav-btn secondary" id="pdf-zoom-btn" type="button" aria-label="Zoom">1x</button>
        <button class="pdf-nav-btn secondary" id="pdf-download-btn" type="button">⬇ Save</button>
      </div>
    </div>
    <div class="pdf-pages-container" id="pdf-pages-container">
      <div class="pdf-pages-inner" id="pdf-pages-inner"></div>
    </div>
  </div>

  <script src="./app.js?v=2"></script>
</body>
</html>
